<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北京地铁客流量可视化系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <h1>北京地铁客流量可视化系统</h1>
    <div id="selected-date-label">加载中…</div>
    <div id="scene-tags"></div>
  </div>

  <div class="controls">
    <div class="mode-selector">
      <button type="button" class="mode-btn" data-mode="year">年</button>
      <button type="button" class="mode-btn" data-mode="month">月</button>
      <button type="button" class="mode-btn active" data-mode="day">日</button>
      <button type="button" class="mode-btn" data-mode="hour">时</button>
    </div>
    <div class="picker-wrap">
      <select id="year-picker" style="display:none"></select>
      <input type="month" id="month-picker" disabled>
      <input type="date" id="day-picker" disabled>
      <span id="hour-display" style="display:none"></span>
    </div>
  </div>

  <div class="player-bar">
    <button type="button" id="btn-step-back" title="后退一步">⏮</button>
    <button type="button" id="btn-play" class="btn-play" title="播放 / 暂停">▶</button>
    <button type="button" id="btn-step-fwd" title="前进一步">⏭</button>
    <div class="speed-selector">
      <label>速度</label>
      <select id="speed-select">
        <option value="2000">0.5x</option>
        <option value="1000" selected>1x</option>
        <option value="500">2x</option>
        <option value="250">4x</option>
      </select>
    </div>
    <div class="progress-wrap">
      <span id="progress-label">0 / 0</span>
      <div class="progress-bar-bg" id="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
        <div id="progress-thumb" class="progress-thumb"></div>
      </div>
    </div>
  </div>

  <div id="loading">正在加载数据…</div>

  <!-- Tidal chart (hour mode only) -->
  <div class="tidal-section" id="tidal-section">
    <div class="tidal-header">
      <h3 class="tidal-title">潮汐剪刀差图</h3>
      <span class="tidal-line-name" id="tidal-line-name"></span>
    </div>
    <canvas id="tidal-canvas" width="800" height="240"></canvas>
  </div>

  <div class="svg-wrapper">
    <div id="svg-container"></div>
  </div>

  <div class="legend-panel">
    <div id="legend"></div>
  </div>

  <div class="ranking-section">
    <h2 class="ranking-title">线路客流量排名</h2>
    <div id="ranking-container"></div>
  </div>

  <div class="footer">
    数据范围：2019-01-01 ~ 2025-12-31 | 时模式为 5:00-23:00 | 客流量单位为万人·次
  </div>

  <script src="js/lineMapping.js"></script>
  <script src="js/flowClassifier.js"></script>
  <script src="js/dataLoader.js"></script>
  <script src="js/svgRenderer.js"></script>
  <script src="js/pulseAnimator.js"></script>
  <script src="js/tooltip.js"></script>
  <script src="js/brushingLinking.js"></script>
  <script src="js/tidalChart.js"></script>
  <script src="js/transferStations.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
